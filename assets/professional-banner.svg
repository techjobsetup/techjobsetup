<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Navy to Silver Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1729;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a2847;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a3f5f;stop-opacity:1" />
    </linearGradient>
    
    <!-- Silver Accent Gradient -->
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8eef5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8b8d8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle radial glow -->
    <radialGradient id="glowGradient">
      <stop offset="0%" style="stop-color:#5a9fd4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0F1729;stop-opacity:0" />
    </radialGradient>

    <!-- Circuit line pattern -->
    <pattern id="circuitPattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <line x1="0" y1="100" x2="200" y2="100" stroke="#3d5a80" stroke-width="1" opacity="0.3"/>
      <line x1="100" y1="0" x2="100" y2="200" stroke="#3d5a80" stroke-width="1" opacity="0.3"/>
      <circle cx="100" cy="100" r="3" fill="#4a7ba7" opacity="0.4"/>
      <circle cx="50" cy="50" r="2" fill="#4a7ba7" opacity="0.3"/>
      <circle cx="150" cy="150" r="2" fill="#4a7ba7" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Main Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Circuit Pattern Overlay -->
  <rect width="1200" height="400" fill="url(#circuitPattern)"/>
  
  <!-- Subtle glow effect top left -->
  <circle cx="150" cy="150" r="200" fill="url(#glowGradient)"/>
  
  <!-- Subtle glow effect bottom right -->
  <circle cx="1050" cy="300" r="180" fill="url(#glowGradient)"/>

  <!-- Decorative geometric shapes - top left -->
  <g opacity="0.15">
    <polygon points="50,20 80,35 65,65 35,50" fill="#e8eef5"/>
    <rect x="90" y="30" width="40" height="40" fill="#a8b8d8" transform="rotate(15 110 50)"/>
    <circle cx="200" cy="60" r="15" fill="#7b8fba"/>
  </g>

  <!-- Decorative geometric shapes - bottom right -->
  <g opacity="0.12">
    <polygon points="1150,370 1120,385 1105,355 1135,340" fill="#e8eef5"/>
    <rect x="1050" y="330" width="50" height="50" fill="#a8b8d8" transform="rotate(-25 1075 355)"/>
    <circle cx="1000" cy="350" r="18" fill="#7b8fba"/>
  </g>

  <!-- Left Section: Icons and Text -->
  <g id="leftSection">
    
    <!-- Icon Group Background -->
    <rect x="30" y="120" width="140" height="160" fill="#ffffff" opacity="0.08" rx="12"/>
    
    <!-- LinkedIn Icon -->
    <rect x="40" y="130" width="38" height="38" fill="#0077B5" rx="6" opacity="0.9"/>
    <path d="M 50 145 L 50 160 M 54 145 L 54 160 M 54 148 Q 54 145 57 145 L 65 145 L 65 160 M 71 145 Q 71 140 77 140 Q 83 140 83 145 L 83 160" 
          stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Naukri Icon (simplified hiring symbol) -->
    <rect x="88" y="130" width="38" height="38" fill="#e74c3c" rx="6" opacity="0.9"/>
    <path d="M 103 145 L 113 145 M 103 153 L 113 153 M 103 151 L 110 151 M 108 138 Q 112 138 112 142 Q 112 145 108 145" 
          stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- GitHub Icon -->
    <rect x="40" y="180" width="38" height="38" fill="#181717" rx="6" opacity="0.9"/>
    <path d="M 59 185 Q 50 185 50 194 L 50 213 Q 50 222 59 222 L 65 222 L 65 217 Q 65 215 67 215 L 75 215 Q 77 215 77 217 L 77 222 L 83 222 Q 92 222 92 213 L 92 194 Q 92 185 83 185 L 59 185 M 62 211 Q 60 211 60 213 Q 60 215 62 215 Q 64 215 64 213 Q 64 211 62 211 M 80 211 Q 78 211 78 213 Q 78 215 80 215 Q 82 215 82 213 Q 82 211 80 211" 
          stroke="#ffffff" stroke-width="1" fill="#ffffff" stroke-linecap="round"/>
    
    <!-- Portfolio Icon (briefcase) -->
    <rect x="88" y="180" width="38" height="38" fill="#27ae60" rx="6" opacity="0.9"/>
    <path d="M 103 190 L 103 185 Q 103 183 105 183 L 121 183 Q 123 183 123 185 L 123 190 M 100 190 L 126 190 L 126 215 Q 126 217 124 217 L 102 217 Q 100 217 100 215 L 100 190 M 113 197 L 113 210" 
          stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
  </g>

  <!-- Center Section: Main Headline -->
  <g id="centerSection">
    
    <!-- Main Headline -->
    <text x="400" y="90" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          text-anchor="middle" fill="#ffffff">
      <tspan>Elevate Your</tspan>
    </text>
    <text x="400" y="150" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          text-anchor="middle">
      <tspan fill="#e8eef5">Career Profile</tspan>
      <tspan fill="#a8b8d8"> on GitHub</tspan>
    </text>
    
    <!-- Subheading -->
    <text x="400" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="normal" 
          text-anchor="middle" fill="#b8c9e0" letter-spacing="0.5">
      Resume Optimization • LinkedIn & Portfolio Enhancement
    </text>
    <text x="400" y="223" font-family="Arial, sans-serif" font-size="14" font-weight="normal" 
          text-anchor="middle" fill="#b8c9e0" letter-spacing="0.5">
      Automation Testing Guidance
    </text>
    
  </g>

  <!-- Right Section: Professional Figure with Growth Chart -->
  <g id="rightSection">
    
    <!-- Background circle for figure -->
    <circle cx="950" cy="220" r="85" fill="#ffffff" opacity="0.06"/>
    
    <!-- Bar Chart (representing career growth) -->
    <g opacity="0.7">
      <!-- Chart bars -->
      <rect x="880" y="275" width="18" height="35" fill="#4a7ba7" rx="2"/>
      <rect x="905" y="260" width="18" height="50" fill="#5a9fd4" rx="2"/>
      <rect x="930" y="240" width="18" height="70" fill="#7bb3e8" rx="2"/>
      <rect x="955" y="220" width="18" height="90" fill="#a8d5ff" rx="2"/>
      
      <!-- Baseline -->
      <line x1="870" y1="310" x2="980" y2="310" stroke="#a8b8d8" stroke-width="2" opacity="0.5"/>
    </g>
    
    <!-- Professional Figure (minimalist silhouette) -->
    <g opacity="0.85">
      <!-- Head -->
      <circle cx="920" cy="155" r="14" fill="#e8eef5"/>
      
      <!-- Body (climbing posture) -->
      <path d="M 920 169 L 920 200" stroke="#e8eef5" stroke-width="3" stroke-linecap="round" fill="none"/>
      
      <!-- Left arm (raised) -->
      <path d="M 920 180 L 895 165" stroke="#e8eef5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      
      <!-- Right arm (reaching up) -->
      <path d="M 920 180 L 945 160" stroke="#e8eef5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      
      <!-- Left leg (stepping up) -->
      <path d="M 920 200 L 905 235" stroke="#e8eef5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      
      <!-- Right leg (stepping up) -->
      <path d="M 920 200 L 935 235" stroke="#e8eef5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>
    
    <!-- Target Star -->
    <g>
      <!-- Star pointing to career peak -->
      <path d="M 995 130 L 1001 150 L 1022 150 L 1005 165 L 1011 185 L 995 170 L 979 185 L 985 165 L 968 150 L 989 150 Z" 
            fill="#f39c12" opacity="0.8" filter="url(#glow)"/>
      <!-- Star glow -->
      <circle cx="995" cy="157" r="25" fill="#f39c12" opacity="0.15"/>
    </g>
    
  </g>

  <!-- Bottom Right: Instagram Handle -->
  <g id="branding">
    <text x="1155" y="375" font-family="Arial, sans-serif" font-size="13" font-weight="600" 
          text-anchor="end" fill="#a8b8d8">
      @techjob_setup
    </text>
  </g>

  <!-- Refined border frame -->
  <rect x="1" y="1" width="1198" height="398" fill="none" stroke="#5a7fa8" stroke-width="1" opacity="0.3" rx="4"/>

</svg>